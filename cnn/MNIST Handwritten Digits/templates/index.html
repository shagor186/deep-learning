<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MNIST Digit Prediction</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md text-center">
        <h1 class="text-2xl font-bold mb-6 text-gray-800">MNIST Digit Prediction</h1>

        <form action="/predict" method="post" enctype="multipart/form-data" class="mb-4">
            <input type="file" name="file" required class="mb-4 w-full text-gray-700 p-2 border rounded">
            <button type="submit" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded w-full">Predict</button>
        </form>

        {% if prediction is defined %}
        <div class="mt-6">
            <h2 class="text-xl font-semibold text-gray-800 mb-2">Predicted Digit: <span class="text-blue-500">{{ prediction }}</span></h2>
            <img src="{{ filepath }}" alt="Uploaded Image" class="mx-auto border rounded shadow w-32 h-32 object-contain">
        </div>
        {% endif %}
    </div>
</body>
</html>
